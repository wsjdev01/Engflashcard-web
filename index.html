<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 플래시카드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ── Home view ── */
    .home-view {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 48px 24px 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    .home-title {
      font-size: 13px;
      font-weight: 700;
      color: #bbb;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .home-heading {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 32px;
    }
    .deck-list { display: flex; flex-direction: column; gap: 14px; }
    .deck-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 18px;
      border: 2px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .deck-card:active { border-color: #4A90E2; box-shadow: 0 4px 20px rgba(74,144,226,0.15); }
    .deck-icon { font-size: 36px; flex-shrink: 0; }
    .deck-info { flex: 1; }
    .deck-name { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .deck-desc { font-size: 13px; color: #999; }
    .deck-arrow { font-size: 18px; color: #ccc; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 0;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .home-btn {
      background: none;
      border: none;
      color: #4A90E2;
      cursor: pointer;
      padding: 6px;
      margin: -6px 0 -6px -6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      line-height: 0;
    }
    .home-btn:active { background: #eaf1fb; }
    .counter { font-size: 14px; color: #999; }
    .hamburger {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #555;
      padding: 4px 8px;
      border-radius: 8px;
      line-height: 1;
    }

    /* ── Dropdown menu ── */
    .menu-overlay { display: none; position: fixed; inset: 0; z-index: 10; }
    .menu-overlay.open { display: block; }
    .menu {
      display: none;
      position: fixed;
      top: 52px;
      right: 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      z-index: 11;
      min-width: 200px;
      overflow: hidden;
    }
    .menu.open { display: block; }
    .menu-item {
      padding: 15px 20px;
      font-size: 15px;
      color: #1a1a1a;
      cursor: pointer;
      border-bottom: 1px solid #f2f2f2;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: #f5f5f5; }

    /* ── Main card view ── */
    .main-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 20px;
      min-height: calc(100vh - 48px);
      justify-content: center;
    }
    .card-wrapper { width: 100%; max-width: 480px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      position: relative;
    }
    .bookmark-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      color: #f5a623;
    }
    .top-section { flex: 1; padding-right: 32px; }
    .meaning { font-size: 20px; font-weight: 600; color: #1a1a1a; line-height: 1.5; margin-bottom: 16px; }
    .explanation { font-size: 15px; color: #555; line-height: 1.6; background: #f8f8f8; border-radius: 8px; padding: 12px; }
    .divider { border: none; border-top: 1px dashed #e0e0e0; margin: 24px 0; }
    .english { font-size: 16px; color: #1a1a1a; opacity: 0.25; line-height: 1.6; font-style: italic; }
    .source { font-size: 11px; color: #ccc; text-align: right; margin-top: 10px; }
    .source a { color: #4A90E2; text-decoration: none; font-weight: 600; }
    .source a:active { opacity: 0.6; }

    .nav { display: flex; gap: 12px; margin-top: 20px; width: 100%; max-width: 480px; }
    .nav button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-prev { background: #e8e8e8; color: #aaa; }
    .btn-prev.active { background: #4A90E2; color: white; }
    .btn-next { background: #4A90E2; color: white; }
    .btn-next.disabled { background: #e8e8e8; color: #aaa; }

    /* ── List view ── */
    .list-view { display: none; flex-direction: column; min-height: 100vh; background: #f5f5f5; }
    .list-view.open { display: flex; }
    .list-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: white; border-bottom: 1px solid #ebebeb; }
    .list-back { background: none; border: none; font-size: 16px; color: #4A90E2; cursor: pointer; font-weight: 600; padding: 0; flex-shrink: 0; }
    .list-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .list-content { flex: 1; overflow-y: auto; padding: 12px 20px 20px; max-width: 520px; width: 100%; margin: 0 auto; }
    .list-item { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 12px; }
    .list-item:active { background: #f0f7ff; }
    .list-item-num { font-size: 12px; color: #ccc; min-width: 28px; text-align: right; flex-shrink: 0; }
    .list-item-meaning { font-size: 15px; color: #1a1a1a; line-height: 1.4; }
    .list-item.static { cursor: default; }
    .list-item.static:active { background: white; }
    .keyword-meaning-heading { font-size: 13px; font-weight: 700; color: #4A90E2; margin: 20px 4px 8px; }
    .keyword-meaning-heading:first-child { margin-top: 4px; }
    .empty-msg { text-align: center; color: #bbb; font-size: 15px; margin-top: 80px; }

    .loading { color: #999; font-size: 16px; }
    .error { color: #e74c3c; font-size: 14px; text-align: center; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Home view -->
  <div id="homeView" class="home-view">
    <div class="home-title">Flash Card</div>
    <div class="home-heading">학습할 목록을 선택하세요</div>
    <div class="deck-list">
      <div class="deck-card" onclick="enterDeck('books')">
        <div class="deck-icon">📚</div>
        <div class="deck-info">
          <div class="deck-name">교재 영어 예문</div>
          <div class="deck-desc">출처: [도서] 네이티브 영어 표현력 사전</div>
        </div>
        <div class="deck-arrow">›</div>
      </div>
      <div class="deck-card" onclick="enterDeck('youtube')">
        <div class="deck-icon">📺</div>
        <div class="deck-info">
          <div class="deck-name">YouTube 영어 예문</div>
          <div class="deck-desc">출처: YouTube</div>
        </div>
        <div class="deck-arrow">›</div>
      </div>
      <div class="deck-card" onclick="openKeywordBrowse()">
        <div class="deck-icon">🔑</div>
        <div class="deck-info">
          <div class="deck-name">키워드별 모아보기</div>
          <div class="deck-desc">단어/표현별로 예문 모아보기</div>
        </div>
        <div class="deck-arrow">›</div>
      </div>
    </div>
  </div>

  <!-- Keyword view -->
  <div class="list-view" id="keywordView">
    <div class="list-header">
      <button class="list-back" onclick="closeKeywordView()">← 돌아가기</button>
      <span class="list-title" id="keywordTitle"></span>
    </div>
    <div class="list-content" id="keywordContent"></div>
  </div>

  <!-- Dropdown menu -->
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="menu" id="menu">
    <div class="menu-item" onclick="showList('seen')">공부한 카드</div>
    <div class="menu-item" onclick="showList('bookmarked')">저장한 카드</div>
    <div class="menu-item" onclick="goToLatest()">이어보기</div>
  </div>

  <!-- Card view -->
  <div id="cardView" class="hidden">
    <div class="header">
      <div class="header-left">
        <button class="home-btn" onclick="exitDeck()" aria-label="홈으로">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5"/>
            <path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/>
            <path d="M9.5 20v-6h5v6"/>
          </svg>
        </button>
      </div>
      <div class="counter" id="counter"></div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
    </div>
    <div class="main-view">
      <div class="card-wrapper">
        <div class="card" id="card">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>
      <div class="nav">
        <button class="btn-prev" id="btnPrev" onclick="prevCard()">← 이전</button>
        <button class="btn-next" id="btnNext" onclick="nextCard()">다음 →</button>
      </div>
    </div>
  </div>

  <!-- List view -->
  <div class="list-view" id="listView">
    <div class="list-header">
      <button class="list-back" onclick="closeList()">← 돌아가기</button>
      <span class="list-title" id="listTitle"></span>
    </div>
    <div class="list-content" id="listContent"></div>
  </div>

  <script>
    const DECKS = {
      books: {
        name: '교재 영어 예문',
        csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTw9hzCMBy2uKaS5VP5oc5ShljTICePzVFr6bqbrnXoHoqsziFvFNiCZuipqBqf28bQMCE-swMWACbH/pub?gid=0&single=true&output=csv',
        storageKey: 'engflashcard_state_books'
      },
      youtube: {
        name: 'YouTube 영어 예문',
        csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTw9hzCMBy2uKaS5VP5oc5ShljTICePzVFr6bqbrnXoHoqsziFvFNiCZuipqBqf28bQMCE-swMWACbH/pub?gid=915780563&single=true&output=csv',
        storageKey: 'engflashcard_state_youtube'
      }
    };

    let currentDeckId = null;
    let cards = [];
    let currentIndex = 0;
    let highWaterMark = 0;
    let bookmarks = new Set();
    let googleSheetKeys = [];

    // ── CSV ──────────────────────────────────────────────────

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      return lines.slice(1).map(line => {
        const cols = parseCSVLine(line);
        return {
          meaning: cols[0]||'', english: cols[1]||'', explanation: cols[2]||'', source: cols[3]||'',
          keyword: cols[4]||'', keywordMeaning: cols[5]||''
        };
      }).filter(c => c.english);
    }

    // ── State ────────────────────────────────────────────────

    function cardKey(c) {
      return c.english + '||' + c.meaning + '||' + c.explanation;
    }

    function saveState() {
      const key = DECKS[currentDeckId].storageKey;
      localStorage.setItem(key, JSON.stringify({
        seen: cards.slice(0, highWaterMark + 1),
        unseen: cards.slice(highWaterMark + 1),
        currentIndex,
        highWaterMark,
        bookmarks: [...bookmarks],
        googleSheetKeys
      }));
    }

    // ── Deck navigation ──────────────────────────────────────

    function enterDeck(deckId) {
      currentDeckId = deckId;
      cards = [];
      currentIndex = 0;
      highWaterMark = 0;
      bookmarks = new Set();
      googleSheetKeys = [];
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('cardView').classList.remove('hidden');
      loadCards();
    }

    function exitDeck() {
      closeMenu();
      closeList();
      currentDeckId = null;
      cards = [];
      document.getElementById('cardView').classList.add('hidden');
      document.getElementById('homeView').classList.remove('hidden');
    }

    // ── Render ───────────────────────────────────────────────

    function updateButtons() {
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      if (currentIndex === 0) btnPrev.classList.remove('active');
      else btnPrev.classList.add('active');
      if (currentIndex === cards.length - 1) btnNext.classList.add('disabled');
      else btnNext.classList.remove('disabled');
    }

    function renderCard() {
      const card = cards[currentIndex];
      const isBookmarked = bookmarks.has(card.english);
      document.getElementById('counter').textContent = `${currentIndex + 1} / ${cards.length}`;
      document.getElementById('card').innerHTML = `
        <button class="bookmark-btn" onclick="toggleBookmark()">${isBookmarked ? '★' : '☆'}</button>
        <div class="top-section">
          <div class="meaning">${card.meaning}</div>
          ${card.explanation ? `<div class="explanation">${card.explanation}</div>` : ''}
        </div>
        <hr class="divider">
        <div class="english">${card.english}</div>
        ${renderSource(card.source)}
      `;
      updateButtons();
    }

    function renderSource(source) {
      if (!source) return '';
      if (/^https?:\/\//i.test(source.trim())) {
        return `<div class="source">출처: <a href="${source}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">영상 보기 ↗</a></div>`;
      }
      return `<div class="source">출처: ${source}</div>`;
    }

    // ── Navigation ───────────────────────────────────────────

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        if (currentIndex > highWaterMark) highWaterMark = currentIndex;
        renderCard();
        saveState();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
        saveState();
      }
    }

    function goToCard(index) {
      currentIndex = index;
      closeMenu();
      closeList();
      renderCard();
      saveState();
    }

    function goToLatest() {
      currentIndex = highWaterMark;
      closeMenu();
      renderCard();
      saveState();
    }

    // ── Bookmark ─────────────────────────────────────────────

    function toggleBookmark() {
      const key = cards[currentIndex].english;
      if (bookmarks.has(key)) bookmarks.delete(key);
      else bookmarks.add(key);
      renderCard();
      saveState();
    }

    // ── Menu ─────────────────────────────────────────────────

    function toggleMenu() {
      document.getElementById('menu').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('open');
    }

    function closeMenu() {
      document.getElementById('menu').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('open');
    }

    // ── List view ─────────────────────────────────────────────

    function showList(type) {
      closeMenu();
      const listTitle = document.getElementById('listTitle');
      const listContent = document.getElementById('listContent');
      let items = [];
      if (type === 'seen') {
        listTitle.textContent = '공부한 카드';
        items = cards.slice(0, highWaterMark + 1).map((c, i) => ({ card: c, num: i + 1, index: i }));
      } else {
        listTitle.textContent = '저장한 카드';
        items = cards.map((c, i) => ({ card: c, num: i + 1, index: i })).filter(({ card }) => bookmarks.has(card.english));
      }
      if (items.length === 0) {
        listContent.innerHTML = `<div class="empty-msg">${type === 'seen' ? '아직 공부한 카드가 없어요.' : '저장한 카드가 없어요. 카드에서 ☆ 를 눌러보세요!'}</div>`;
      } else {
        listContent.innerHTML = items.map(({ card, num, index }) => `
          <div class="list-item" onclick="goToCard(${index})">
            <div class="list-item-num">${num}</div>
            <div class="list-item-meaning">${card.meaning}</div>
          </div>
        `).join('');
      }
      document.getElementById('cardView').classList.add('hidden');
      document.getElementById('listView').classList.add('open');
    }

    function closeList() {
      document.getElementById('listView').classList.remove('open');
      document.getElementById('cardView').classList.remove('hidden');
    }

    // ── Keyword browse ──────────────────────────────────────────

    let keywordCards = [];
    let uniqueKeywords = [];
    let currentKeywordIndex = null;

    async function openKeywordBrowse() {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('keywordView').classList.add('open');
      document.getElementById('keywordTitle').textContent = '키워드별 모아보기';
      document.getElementById('keywordContent').innerHTML = '<div class="loading">불러오는 중...</div>';
      currentKeywordIndex = null;
      try {
        const text = await fetch(DECKS.books.csvUrl).then(r => r.text());
        keywordCards = parseCSV(text).filter(c => c.keyword);
        uniqueKeywords = [...new Set(keywordCards.map(c => c.keyword))];
        renderKeywordIndex();
      } catch (e) {
        document.getElementById('keywordContent').innerHTML = `<div class="error">데이터를 불러오지 못했어요.<br>CSV 링크를 확인해주세요.</div>`;
      }
    }

    function renderKeywordIndex() {
      currentKeywordIndex = null;
      document.getElementById('keywordTitle').textContent = '키워드별 모아보기';
      const content = document.getElementById('keywordContent');
      if (uniqueKeywords.length === 0) {
        content.innerHTML = `<div class="empty-msg">아직 등록된 키워드가 없어요.</div>`;
        return;
      }
      content.innerHTML = uniqueKeywords.map((k, i) => `
        <div class="list-item" onclick="renderKeywordDetail(${i})">
          <div class="list-item-meaning">${k}</div>
        </div>
      `).join('');
    }

    function renderKeywordDetail(index) {
      currentKeywordIndex = index;
      const keyword = uniqueKeywords[index];
      document.getElementById('keywordTitle').textContent = keyword;
      const matched = keywordCards.filter(c => c.keyword === keyword);
      const groups = new Map();
      for (const c of matched) {
        const m = c.keywordMeaning || '';
        if (!groups.has(m)) groups.set(m, []);
        groups.get(m).push(c);
      }
      document.getElementById('keywordContent').innerHTML = [...groups.entries()].map(([meaning, list]) => `
        ${meaning ? `<div class="keyword-meaning-heading">${meaning}</div>` : ''}
        ${list.map(c => `
          <div class="list-item static">
            <div class="list-item-meaning">${c.meaning}<br><span style="opacity:.5">${c.english}</span></div>
          </div>
        `).join('')}
      `).join('');
    }

    function closeKeywordView() {
      if (currentKeywordIndex !== null) {
        renderKeywordIndex();
      } else {
        document.getElementById('keywordView').classList.remove('open');
        document.getElementById('homeView').classList.remove('hidden');
      }
    }

    // ── Swipe ─────────────────────────────────────────────────

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', e => {
      if (document.getElementById('listView').classList.contains('open')) return;
      if (!currentDeckId) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx < 0) nextCard();
        else prevCard();
      }
    });

    // ── Shuffle ───────────────────────────────────────────────

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ── Load ──────────────────────────────────────────────────

    function isReordered(oldKeys, newKeys) {
      const newSet = new Set(newKeys);
      const oldSet = new Set(oldKeys);
      const oldCommon = oldKeys.filter(k => newSet.has(k));
      const newCommon = newKeys.filter(k => oldSet.has(k));
      return oldCommon.join('||') !== newCommon.join('||');
    }

    async function loadCards() {
      document.getElementById('card').innerHTML = '<div class="loading">불러오는 중...</div>';
      const deck = DECKS[currentDeckId];
      try {
        const res = await fetch(deck.csvUrl);
        const text = await res.text();
        const fetched = parseCSV(text);
        if (fetched.length === 0) {
          document.getElementById('card').innerHTML = `<div class="error" style="margin-top:40px">아직 카드가 없어요.<br>구글시트에 문장을 추가해보세요!</div>`;
          return;
        }
        const newKeys = fetched.map(c => c.english);
        const newMap = new Map(fetched.map(c => [c.english, c]));
        const saved = JSON.parse(localStorage.getItem(deck.storageKey) || 'null');

        if (!saved) {
          googleSheetKeys = newKeys;
          cards = shuffle(fetched);
          currentIndex = 0;
          highWaterMark = 0;
          bookmarks = new Set();
          saveState();
          renderCard();
          return;
        }

        bookmarks = new Set(saved.bookmarks || []);
        const oldKeys = saved.googleSheetKeys || [];

        if (isReordered(oldKeys, newKeys)) {
          googleSheetKeys = newKeys;
          cards = shuffle(fetched);
          currentIndex = 0;
          highWaterMark = 0;
          saveState();
          renderCard();
          return;
        }

        const seenCards = [];
        const contentChangedCards = [];
        for (const c of (saved.seen || [])) {
          const newCard = newMap.get(c.english);
          if (!newCard) continue;
          if (cardKey(newCard) !== cardKey(c)) contentChangedCards.push(newCard);
          else seenCards.push(newCard);
        }

        const existingUnseen = (saved.unseen || [])
          .filter(c => newMap.has(c.english))
          .map(c => newMap.get(c.english));

        const knownKeys = new Set([...seenCards.map(c => c.english), ...existingUnseen.map(c => c.english)]);
        const newCards = fetched.filter(c => !knownKeys.has(c.english));
        const mergedUnseen = shuffle([...existingUnseen, ...contentChangedCards, ...newCards]);

        googleSheetKeys = newKeys;
        cards = [...seenCards, ...mergedUnseen];
        highWaterMark = seenCards.length > 0 ? seenCards.length - 1 : 0;
        currentIndex = highWaterMark;

        saveState();
        renderCard();
      } catch (e) {
        document.getElementById('card').innerHTML = `<div class="error">데이터를 불러오지 못했어요.<br>CSV 링크를 확인해주세요.</div>`;
      }
    }
  </script>
</body>
</html>
